<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="Row of TeraMind server racks in a data center">
  <defs>
    <radialGradient id="ceiling" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#f5f5f7" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#f5f5f7" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor-fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#000000" stop-opacity="1"/>
    </linearGradient>
    <pattern id="vents" width="6" height="26" patternUnits="userSpaceOnUse">
      <rect x="1" y="7" width="3" height="12" rx="1" fill="#000000" opacity="0.6"/>
    </pattern>
    <g id="unit">
      <rect width="130" height="26" rx="3" fill="#1d1d1f"/>
      <rect x="50" width="72" height="26" fill="url(#vents)"/>
      <circle cx="12" cy="13" r="2.5" fill="#6e6e73"/>
      <circle cx="22" cy="13" r="2.5" fill="#6e6e73"/>
    </g>
    <g id="rack">
      <rect width="150" height="380" rx="10" fill="#0e0e0e" stroke="#333336"/>
      <rect x="10" y="4" width="130" height="3" rx="1.5" fill="#f5f5f7" opacity="0.35"/>
      <use href="#unit" x="10" y="14"/><use href="#unit" x="10" y="46"/><use href="#unit" x="10" y="78"/>
      <use href="#unit" x="10" y="110"/><use href="#unit" x="10" y="142"/><use href="#unit" x="10" y="174"/>
      <use href="#unit" x="10" y="206"/><use href="#unit" x="10" y="238"/><use href="#unit" x="10" y="270"/>
      <use href="#unit" x="10" y="302"/><use href="#unit" x="10" y="334"/>
    </g>
    <g id="row">
      <use href="#rack" x="45" y="60"/><use href="#rack" x="225" y="60"/><use href="#rack" x="405" y="60"/>
      <use href="#rack" x="585" y="60"/><use href="#rack" x="765" y="60"/>
    </g>
  </defs>

  <rect width="960" height="540" fill="url(#ceiling)"/>
  <rect x="120" y="22" width="720" height="4" rx="2" fill="#f5f5f7" opacity="0.5"/>

  <use href="#row"/>

  <g fill="#f5f5f7">
    <circle cx="67" cy="87" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="77" cy="215" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="67" cy="343" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="247" cy="119" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="257" cy="279" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="247" cy="407" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="427" cy="151" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="437" cy="247" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="427" cy="375" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="607" cy="87" r="2.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.7s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="617" cy="311" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.1s" repeatCount="indefinite"/></circle>
    <circle cx="787" cy="183" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.3s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="797" cy="343" r="2.5"><animate attributeName="opacity" values="1;0.2;1" dur="1.9s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>
  <g fill="#ffd500">
    <circle cx="437" cy="119" r="2.5"><animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="797" cy="247" r="2.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" begin="1.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(0 880) scale(1 -1)" opacity="0.18">
    <use href="#row"/>
  </g>
  <rect y="440" width="960" height="100" fill="url(#floor-fade)"/>
</svg>
