<footer class="border-t border-steel bg-graphite/80">
  <div class="mx-auto max-w-6xl px-4 py-12">
    <div class="grid gap-10 sm:grid-cols-2 md:grid-cols-4">
      <div>
        <p class="font-display text-product-label font-semibold text-porcelain">TeraMind</p>
        <p class="mt-2 max-w-xs text-body text-ash">GPU rental and recommendations for AI teams.</p>
      </div>

      @for (column of columns; track column.title) {
        <div>
          <p class="text-utility-nav font-semibold text-porcelain">{{ column.title }}</p>
          <ul class="mt-3 flex flex-col gap-2">
            @for (link of column.links; track link.path) {
              <li>
                <a [routerLink]="link.path" class="text-utility-nav text-ash transition-colors hover:text-porcelain">{{ link.label }}</a>
              </li>
            }
          </ul>
        </div>
      }
    </div>

    <div class="mt-10 flex flex-col gap-2 border-t border-steel pt-6 text-utility-nav text-ash sm:flex-row sm:justify-between">
      <p>© {{ year }} TeraMind. All rights reserved.</p>
      <p>Fictional company — SUP'COM web project.</p>
    </div>
  </div>
</footer>
