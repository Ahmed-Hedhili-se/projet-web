<div class="mt-3 grid grid-cols-4 gap-1.5" aria-hidden="true">  <!-- 4 barres de force -->
  @for (bar of bars; track bar) {
    <div class="h-1 overflow-hidden rounded-pill bg-steel">
      <div class="h-full rounded-pill bg-porcelain transition-[width] duration-500 ease-out" [style.width.%]="strength().score >= bar ? 100 : 0"></div> <!-- se remplit en douceur -->
    </div>
  }
</div>
<p class="mt-2 flex justify-between gap-4 text-utility-nav text-ash">
  <span>At least 8 characters. Mix letters, numbers and symbols.</span>
  <span class="shrink-0 font-semibold text-porcelain" aria-live="polite">{{ strength().label }}</span>
</p>
